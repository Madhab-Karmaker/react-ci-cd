name: react-ci-cd
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
jobs:
  job-name:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Check Node.js version
        run: node --version
      
      - name: Install dependencies
        run: npm install
      
      - name: Eslint
        run: npm run lint
      
      - name: Test
        run: npm run build
  